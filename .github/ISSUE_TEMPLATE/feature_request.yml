name: Feature request
description: Propose a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [open issues](https://github.com/MatiCoding/calculetra/issues) first to make sure it has not been proposed already.

  - type: textarea
    id: what
    attributes:
      label: What
      description: What you would like to add or change.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves or why it would be useful.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cifras
        - Letras
        - Accounts (sign up / log in)
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: How we will know it is done. One checkbox per criterion.
      value: |
        - [ ] 
    validations:
      required: true

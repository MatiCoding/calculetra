name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the [open issues](https://github.com/MatiCoding/calculetra/issues) first to make sure it has not been reported already.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
      placeholder: After finishing the game, the score shows 0 even though I reached the target.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps to see the bug.
      placeholder: |
        1. Go to Cifras
        2. Reach the target with 25 × 4
        3. Click "Finish"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cifras
        - Letras
        - Accounts (sign up / log in)
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11 / Safari on iPhone 15
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra information
      description: Optional. You can paste images here.

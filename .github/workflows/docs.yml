name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# The deploy job needs to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push waits instead of cancelling a deploy in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - uses: actions/configure-pages@v5
            - run: npm ci
            - run: npm run docs:build
            - uses: actions/upload-pages-artifact@v4
              with:
                path: docs/.vitepress/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (for example v0.1.2)'
        required: true

permissions:
  contents: read

# Only one production deploy at a time; a new one waits instead of cancelling a deploy in progress
concurrency:
  group: production
  cancel-in-progress: false

jobs:
    deploy:
        # Pre-releases also fire "published", so skip them. A manual run has no release, so it always runs.
        if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
        runs-on: ubuntu-latest

        steps:
            # On a release, github.ref is the tag. On a manual run, use the tag from the input.
            - uses: actions/checkout@v5
              with:
                ref: ${{ inputs.tag || github.ref }}
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npm run build
              env:
                  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
                  VITE_UNDER_CONSTRUCTION: ${{ vars.VITE_UNDER_CONSTRUCTION }}
            - run: npx wrangler deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

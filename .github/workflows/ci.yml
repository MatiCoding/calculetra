name: CI

on:
  push:
    branches: [ developer ]
  pull_request:
    branches: [ main ]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 22
                cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build
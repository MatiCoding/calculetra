name: CI

on:
  push:
    branches: [ developer ]
  pull_request:
    branches: [ main, developer ]

# One CI run per branch or PR; a new push cancels the outdated one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npm run lint

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npm test

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npm run build

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                node-version: 24
                cache: npm
            - run: npm ci
            - run: npm run docs:build